$schema: https://json-schema.org/draft/2020-12/schema
$id: https://multiplai.local/schemas/core-lock.schema.yaml
type: object
additionalProperties: false
required: [core, sops]
properties:
  core:
    type: object
    additionalProperties: false
    required: [version, commit, digest]
    properties:
      repository: {type: string, pattern: '^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*$'}
      access: {enum: [public, private]}
      version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
      commit: {type: string, pattern: '^[0-9a-f]{40}$'}
      digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  sops: {type: array, items: {type: string}, uniqueItems: true}
