name: validate
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    needs: [optional-tools, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream validation success
        run: |
          test '${{ needs.optional-tools.result }}' = success
          test '${{ needs.secrets.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y zstd minisign
      - run: python -m pip install -e '.[dev,publishing]'
      - run: python tools/check_core.py
  optional-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [dev, 'dev,publishing,web,google,llm,video']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python tools/check_offline_cli.py
      - if: matrix.extras != 'dev'
        run: python -m pytest -q tests/test_optional_tools.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan fetched history with redacted results
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow'
