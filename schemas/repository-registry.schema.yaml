$schema: https://json-schema.org/draft/2020-12/schema
$id: https://multiplai.local/schemas/repository-registry.schema.yaml
type: object
additionalProperties: false
required: [schema_version, repositories]
properties:
  schema_version: {const: 1}
  repositories:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, github, remote_url, default_branch, allowed_branches, allowed_branch_prefixes, visibility, allowed_agents]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$'}
        github: {type: string, pattern: '^[^/]+/[^/]+$'}
        remote_url:
          type: string
          pattern: '^(https://github\.com/[^/]+/[^/]+(?:\.git)?|git@github\.com:[^/]+/[^/]+(?:\.git)?)$'
        default_branch: {const: main}
        allowed_branches:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^(main|(codex|hermes)/(?!.*\.\.)(?!.*//)[A-Za-z0-9._/-]+)$'}
        allowed_branch_prefixes:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^(codex|hermes/[A-Za-z0-9][A-Za-z0-9._-]{0,79})/$'}
        visibility: {enum: [private, internal]}
        allowed_agents:
          type: array
          minItems: 1
          items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$'}
          uniqueItems: true
